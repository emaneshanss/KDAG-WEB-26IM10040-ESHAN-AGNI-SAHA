<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDAG - Bootcamp Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="top-nav">
        <div class="brand-logo">KDAG</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </nav>

    <main class="page-content">
        <section class="reg-wrapper">
            <h1>Bootcamp Registration</h1>
            
            <form id="kdagRegForm" novalidate>
                <div class="input-field">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" placeholder="Your full name">
                </div>

                <div class="input-field">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber" placeholder="26XX10001">
                </div>

                <div class="input-field">
                    <label for="studentEmail">Institute Email / Email</label>
                    <input type="email" id="studentEmail" placeholder="yourname@kgpian.iitkgp.ac.in">
                </div>

                <div class="input-field">
                    <label for="deptSelect">Department</label>
                    <select id="deptSelect">
                        <option value="">Select your department</option>
                        <option value="IM">Industrial & Systems Engineering</option>
                        <option value="CS">Computer Science & Engineering</option>
                        <option value="EC">Electronics & Electrical Communication</option>
                        <option value="EE">Electrical Engineering</option>
                        <option value="ME">Mechanical Engineering</option>
                        <option value="MA">Mathematics And Computing</option>
                        <option value="CH">Chemical Engineering</option>
                        <option value="CE">Civil Engineering</option>
                        <option value="AE">Aerospace Engineering</option>
                        <option value="NA">Ocean Engineering and Naval Architecture</option>
                        <option value="MI">Mining Engineering</option>
                        <option value="AI">Artificial Intelligence</option>
                        <option value="GG">Geology and Geophysics</option>
                        <option value="AGFE">Agriculture and Food Engineering</option>
                        <option value="HS">Economics</option>
                    </select>
                </div>

                <button type="submit" id="submitFormBtn">Register</button>
            </form>

            <div id="statusPopup" class="hidden">
                Registration Successful! Welcome to the Bootcamp.
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Kharagpur Data Analytics Group • IIT Kharagpur</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
